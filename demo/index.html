<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>良承律所 · GEO优化平台</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%237C3AED'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'>G</text></svg>">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo-area">
      <div class="logo-mark">G</div>
      <div class="logo-text">
        <div class="logo-title">良承GEO运营中枢</div>
        <div class="logo-sub">河南良承律师事务所</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="foot-line">GEO 全链路运营平台 V1.0</div>
      <div class="foot-line dim">词库 → 内容 → 分发 → 监测 → 询盘</div>
    </div>
  </aside>
  <div class="sidebar-mask" id="sidebar-mask"></div>
  <main id="main">
    <header id="topbar">
      <button id="menu-btn" class="menu-btn" aria-label="打开菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="topbar-left">
        <h1 id="page-title">数据看板</h1>
        <span id="page-desc" class="page-desc"></span>
      </div>
      <div class="topbar-right">
        <a href="../index.html" class="back-link" title="返回作品集主页">← 作品集</a>
        <div class="conn-status" id="conn-status"><span class="dot"></span>演示数据已加载</div>
        <div class="role-switch">
          <label>当前角色</label>
          <select id="role-select">
            <option value="optimizer">GEO优化师</option>
            <option value="director">市场部主管</option>
            <option value="lawyer">资深律师 / 合伙人</option>
            <option value="webops">官网运营</option>
          </select>
        </div>
      </div>
    </header>
    <div class="static-banner">静态演示模式 · 数据为云端真实快照（144 条），写操作保存在本机浏览器，AI 生成为本地示例输出</div>
    <div id="view" class="view"><div class="loading-block">正在加载演示数据…</div></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="js/config.js"></script>
<script src="js/snapshot.js"></script>
<script src="js/api.js"></script>
<script src="js/compliance.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/keywords.js"></script>
<script src="js/views/prompts.js"></script>
<script src="js/views/contents.js"></script>
<script src="js/views/channels.js"></script>
<script src="js/views/monitor.js"></script>
<script src="js/views/nap.js"></script>
<script src="js/views/inquiries.js"></script>
<script src="js/app.js"></script>
</body>
</html>
